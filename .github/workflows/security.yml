name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit
      - name: Run gitleaks
        # Use the license-free gitleaks binary (the gitleaks-action requires a paid
        # license for organization accounts). Pinned to a release; bump as needed.
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --exit-code 1

  audit:
    name: Dependency Audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sdk
            dir: packages/sdk
          - name: cli
            dir: packages/cli
          - name: dashboard
            dir: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      # What ships must be clean: a high advisory in a production dependency
      # fails the job. Dev and test tooling is audited too and shown as a
      # warning, so an advisory there with no fix yet doesn't stop every pull
      # request (picomatch GHSA-fc5q-39xc-vjpf, November 2026).
      - name: npm audit, what ships (high+)
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit, dev tooling (warns)
        working-directory: ${{ matrix.dir }}
        # Only an advisory is a warning. If the audit itself couldn't run (the
        # registry is down, the lockfile is broken), its report has no
        # advisory counts and the step fails.
        run: |
          if npm audit --audit-level=high; then exit 0; fi
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node -e 'const a = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!a.metadata || !a.metadata.vulnerabilities) process.exit(1)' "$RUNNER_TEMP/audit.json"
          echo "::warning title=Dev dependency advisory (${{ matrix.name }})::A high advisory in dev or test tooling. It doesn't ship; see this step's log."

  dependency-review:
    name: Dependency Review
    # PR-only: diffs the dependency graph between base and head to block newly
    # introduced vulnerable or disallowed-license dependencies before merge.
    # Requires the repo "Dependency graph" setting (Settings → Security & analysis).
    # Gated behind a repo variable so it stays *skipped* (not failed) until you turn
    # it on. To enable and enforce: enable Dependency graph, then set a repo variable
    # (Settings → Secrets and variables → Actions → Variables):
    #   ENABLE_DEPENDENCY_REVIEW = true
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  gate:
    name: Security Gate
    if: always()
    needs: [secrets, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce results
        run: |
          if [ "${{ needs.secrets.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ]; then
            echo "One or more security checks failed"
            exit 1
          fi
