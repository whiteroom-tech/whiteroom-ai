name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sdk
            dir: packages/sdk
          - name: cli
            dir: packages/cli
          - name: dashboard
            dir: apps/dashboard
          # The SDK and CLI are published, and their users run Node 20 and later.
          - name: sdk (Node 20)
            dir: packages/sdk
            node: "20"
          - name: cli (Node 20)
            dir: packages/cli
            node: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node || '24' }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck
        working-directory: ${{ matrix.dir }}
        run: npm run typecheck --if-present
      - name: Lint
        working-directory: ${{ matrix.dir }}
        run: npm run lint --if-present
      - name: Build
        working-directory: ${{ matrix.dir }}
        # Non-secret placeholder env so the Next.js dashboard build resolves at
        # build time. These are inert defaults, never real credentials — the
        # DB client is constructed lazily, so no DB_* vars are needed here.
        env:
          AUTH_GOOGLE_ID: placeholder.apps.googleusercontent.com
          AUTH_GOOGLE_SECRET: placeholder-secret
          AUTH_SECRET: placeholder-secret
          NEXT_PUBLIC_PROXY_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build --if-present
      - name: Test
        working-directory: ${{ matrix.dir }}
        run: npm test --if-present
      # The migration runner's locking, rollback and psql steps, against a real
      # Postgres (the runner is run by hand against prod, so it is tested here).
      - name: Start Postgres
        if: matrix.dir == 'apps/dashboard'
        run: |
          docker run -d --name pg -e POSTGRES_HOST_AUTH_METHOD=trust -p 5432:5432 \
            postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres -q && break; sleep 1; done
          docker exec pg createdb -U postgres wr_migrate_test
      - name: Migration runner against Postgres
        if: matrix.dir == 'apps/dashboard'
        working-directory: apps/dashboard
        env:
          WR_TEST_DATABASE: wr_migrate_test
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          PGUSER: postgres
        run: npx vitest run src/__tests__/migrate.db.test.ts
