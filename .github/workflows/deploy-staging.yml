name: Deploy staging

# Every merge to main lands on staging first (GCP project whiteroom-staging,
# its own Cloud SQL, secrets and service accounts — nothing shared with prod).
# Prod only ever gets an image built here, via promote-prod.yml.
#
# NEXT_PUBLIC_PROXY_URL is baked into the bundle at build time, so one commit
# produces two images from the same build: <sha>-staging (points at the
# staging engine) and <sha> (points at proxy.whiteroom.tech, the one prod runs).
#
# Auth is keyless (Workload Identity Federation). The gh-deploy-staging service
# account only trusts this file on refs/heads/main — renaming it or running it
# from another branch fails at the auth step.
on:
  push:
    branches: [main]
    # Everything the dashboard image is built from. Keep in step with the
    # pathspec in "Check this is still the newest image commit" below. A commit outside these
    # gets no image; run this workflow by hand (Actions → Deploy staging →
    # Run workflow) if it still needs promoting.
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - ".dockerignore"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Shared with promote-prod.yml: a staging deploy and a promotion never run
# at the same time, so promote can't check a commit staging is replacing.
concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

env:
  IMAGE: us-central1-docker.pkg.dev/whiteroom-prod/cloud-run-source-deploy/whiteroom-dashboard
  PROJECT: whiteroom-staging
  REGION: us-central1
  SQL_INSTANCE: whiteroom-staging:us-central1:whiteroom-db-staging
  STAGING_URL: https://whiteroom-dashboard-667088277671.us-central1.run.app
  STAGING_ENGINE_URL: https://whiteroom-engine-667088277671.us-central1.run.app

jobs:
  deploy:
    name: Build and deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History, so the freshness check below can compare against main.
          fetch-depth: 0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/272235454263/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: gh-deploy-staging@whiteroom-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build images
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -f apps/dashboard/Dockerfile \
            --build-arg NEXT_PUBLIC_PROXY_URL="$STAGING_ENGINE_URL" \
            -t "$IMAGE:$GITHUB_SHA-staging" .
          docker build -f apps/dashboard/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA-staging"
          docker push "$IMAGE:$GITHUB_SHA"

      # Two merges seconds apart start two runs; the older one can finish
      # last and put an older commit back on staging (Oct 1: #117 over #118).
      # Just before deploying, skip if main already has a newer commit that
      # changes the image: that commit's own run deploys it. Only commits
      # touching the image's paths count, so a docs-only push can't stall it.
      - name: Check this is still the newest image commit
        id: fresh
        run: |
          git fetch --quiet origin main
          newest=$(git log -1 --format=%H origin/main -- apps/dashboard packages .dockerignore .github/workflows/deploy-staging.yml)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$newest"; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping: main has a newer image commit (${newest::7}); its run deploys staging."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      # The full staging config lives here, so this step is its source of truth.
      # Env is split on "|" because AUTH_EMAIL_FROM contains spaces and "<>".
      - name: Deploy to staging
        if: steps.fresh.outputs.stale != 'true'
        run: |
          gcloud run deploy whiteroom-dashboard \
            --project "$PROJECT" --region "$REGION" --platform managed \
            --image "$IMAGE:$GITHUB_SHA-staging" \
            --service-account "whiteroom-dashboard-run@$PROJECT.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets "AUTH_SECRET=whiteroom-dashboard-auth-secret:latest,DB_PASSWORD=whiteroom-dashboard-db-password:latest,AUTH_GOOGLE_SECRET=whiteroom-dashboard-google-client-secret:latest,AUTH_RESEND_KEY=whiteroom-dashboard-resend-key:latest,WR_ENTITLEMENT_SYNC_SECRET=whiteroom-entitlement-sync-secret:latest,WR_SANDBOX_SERVICE_SECRET=whiteroom-sandbox-service-secret:latest,WR_DASHBOARD_SERVICE_SECRET=whiteroom-dashboard-service-secret:latest" \
            --set-env-vars "^|^DB_SOCKET_PATH=/cloudsql/$SQL_INSTANCE|DB_USER=whiteroom_dashboard_app|DB_NAME=whiteroom_dashboard|AUTH_GOOGLE_ID=272235454263-pbmhape0njeuhtr700s9ae8qct4f14e5.apps.googleusercontent.com|AUTH_URL=$STAGING_URL|AUTH_TRUST_HOST=true|AUTH_EMAIL_FROM=WhiteRoom Staging <no-reply@whiteroom.tech>|NEXT_PUBLIC_PROXY_URL=$STAGING_ENGINE_URL" \
            --min-instances 0 --max-instances 2 --cpu-boost --memory 512Mi --cpu 1 --port 8080 \
            --no-invoker-iam-check \
            --labels "env=staging,managed-by=github-actions,commit-sha=$GITHUB_SHA,staging-run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --quiet

      - name: Smoke test
        if: steps.fresh.outputs.stale != 'true'
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "$STAGING_URL/sign-in" | grep -q "Sign in"; then
              echo "Staging is serving $GITHUB_SHA: $STAGING_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$STAGING_URL/sign-in did not render after deploy"
          exit 1

      # Only reached when the smoke test passed (a failed step stops the job).
      # The tag names this run and attempt, which staging's staging-run label
      # also carries; promote-prod requires the tag for the run staging is on.
      # A new tag per run means a failed re-run can't inherit an older pass,
      # and it only needs tag create (the deploy account can't delete or move
      # tags; moving one is a delete plus a create).
      - name: Mark verified
        if: steps.fresh.outputs.stale != 'true'
        run: gcloud artifacts docker tags add "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA-verified-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --quiet

      - name: Summary
        if: steps.fresh.outputs.stale != 'true'
        run: |
          {
            echo "### Staging: \`${GITHUB_SHA::7}\`"
            echo "$STAGING_URL"
            echo
            echo "When it checks out, run **Promote to prod** (it defaults to this commit)."
          } >> "$GITHUB_STEP_SUMMARY"
