name: PR health stats

# How often the PR health bot's line comments led to a fix before merge.
# The report is in the run summary.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Look back this many days
        default: "30"

permissions:
  contents: read
  pull-requests: read

jobs:
  stats:
    name: PR health stats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: node .github/scripts/pr-health-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '30' }}
